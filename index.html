<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Will U Bee My Girlfriend 💗</title>
    <style>
      :root {
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: #fff4f7;
        color: #4a2c35;
        font-family: "Sarabun", "Noto Sans Thai", system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        overflow: hidden;
      }
      .wrap {
        padding: 16px;
        width: 100%;
        max-width: 420px;
      }
      img {
        width: min(75vw, 300px);
        height: auto;
        mix-blend-mode: multiply;
      }
      h1 {
        font-size: 1.3rem;
        font-weight: 700;
        margin: 8px 0 24px;
      }
      .btns {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        min-height: 100px;
      }
      button {
        border: 0;
        color: #fff;
        cursor: pointer;
        font-family: inherit;
        border-radius: 8px;
        transition: all 0.15s;
      }
      #yes {
        background: #22b573;
        font-size: 20px;
        padding: 10px 26px;
        font-weight: 700;
      }
      #no {
        background: #e0393e;
        font-size: 13px;
        padding: 6px 12px;
      }
      #done {
        display: none;
      }
      .pop {
        animation: pop 0.5s ease;
      }
      @keyframes pop {
        0% {
          transform: scale(0.3);
        }
        70% {
          transform: scale(1.1);
        }
        100% {
          transform: scale(1);
        }
      }
      .heart {
        position: fixed;
        bottom: 0;
        pointer-events: none;
        opacity: 0;
        animation: float 3s ease-in;
      }
      @keyframes float {
        0% {
          transform: translateY(0);
          opacity: 0;
        }
        20% {
          opacity: 1;
        }
        100% {
          transform: translateY(-90vh);
          opacity: 0;
        }
      }
    </style>

      function spawnHeart() {
        const h = document.createElement("span");
        h.className = "heart";
        h.textContent = ["💗", "💖", "💕", "🤍"][Math.floor(Math.random() * 4)];
        h.style.left = Math.random() * 95 + "vw";
        h.style.fontSize = 18 + Math.random() * 22 + "px";
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 3200);
      }
    </script>
  </body>
</html>
